# Muscle map: open the Z-Anatomy atlas (CC BY-SA 4.0, from BodyParts3D, DBCLS) in Blender, list what is
# inside it, and render its muscular system. Run by hand; results are committed to this branch.
name: muscle-map-model
on:
  workflow_dispatch:
  push:                       # runs when the scripts change on this branch (a branch's workflow can't be started by hand)
    branches: [muscle-map-tools]
    paths: ["tools/muscle-map/export.py", ".github/workflows/muscle-map-model.yml"]
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2 LTS and the atlas
        run: |
          set -e
          curl -sSL --max-time 600 -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz && mv blender-4.2.3-linux-x64 blender
          timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 || true
          git clone -q --depth 1 https://github.com/Z-Anatomy/Models-of-human-anatomy za
          unzip -q za/Z-Anatomy.zip -d za/x
      - name: Export for the web
        run: |
          mkdir -p tools/muscle-map/web
          /usr/bin/time -v ./blender/blender -b za/x/Z-Anatomy/Startup.blend --python tools/muscle-map/export.py -- tools/muscle-map/web > tools/muscle-map/web/export-run.log 2>&1 || echo "exit $?" >> tools/muscle-map/web/export-run.log
          grep -E "kept|exported|done|Error|error|Maximum resident|Elapsed|exit" tools/muscle-map/web/export-run.log | tail -20
          ls -la tools/muscle-map/web
          git config user.name "muscle-map-bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/muscle-map/web && git commit -qm "Muscle map: web export of the atlas's muscles and skeleton (run ${{ github.run_id }})" && git push -q || true
