<html lang="en">
<head>

<meta property="og:description" content="Experiments in storytelling by Krishna Somandepalli.">

<style>
/* Between the Lines. The mark: the name in Michroma, wide and spaced, held between two rules, with "the" in lamp gold.
   The B|L monogram (Syne ExtraBold outlines, gold bar) is the icon and signs the footer. Night ground, as in the films. */
@font-face{font-family:"Michroma";font-display:swap;src:url("assets/fonts/michroma.woff") format("woff")}
:root{
  --night:#0f0f0f;
  --ink:#f3efe7;
  --dim:#a39d92;
  --gold:#e2a446;
  --rule:rgba(243,239,231,.7);
  --hair:#2b2a28;
  --f-mark:"Michroma",system-ui,sans-serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-text);line-height:1.6;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
main{max-width:1080px;margin:0 auto}

header{text-align:center}
/* The mark scales with the screen so it never wraps: its width is about 22 of its own letters. */
.mark{display:inline-block;font-size:clamp(12px,calc((100vw - 48px) / 23),26px);margin:0}
.mark::before,.mark::after{content:"";display:block;height:1px;background:var(--rule)}
.mark span{display:block;white-space:nowrap;font:400 1em/1 var(--f-mark);letter-spacing:.36em;text-transform:uppercase;
  padding:.9em .5em .9em calc(.5em + .36em)}
/* "THE" is drawn, not typeset: Michroma's own T, H and E (their outlines are rectangles; these are those
   rectangles, at the same advance and spacing as the letters around them), so the bars can move. The T's bar,
   the H's bar and the E's middle bar rise and fall in turn, like the dots of someone typing: each on its own
   slow rhythm (1.7, 2.1, 2.5 s) and height, so the three drift in and out of step and never repeat exactly. */
.mark .the{width:3.9570em;height:0.75em;vertical-align:baseline;fill:var(--gold);overflow:visible}
.mark .the .b{animation:bob 1.7s cubic-bezier(.37,0,.63,1) 0s infinite alternate;--lift:-230px}
.mark .the .b2{--lift:-185px;animation-duration:2.1s;animation-delay:-.55s}
.mark .the .b3{--lift:-210px;animation-duration:2.5s;animation-delay:-1.15s}
@keyframes bob{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--lift));opacity:.66}}
@media (prefers-reduced-motion:reduce){.mark .the .b{animation:none}}
.kind{margin:22px 0 0;white-space:nowrap;font:400 clamp(9px,calc((100vw - 48px) / 34),11px)/1 var(--f-mark);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.line{margin:30px auto 0;max-width:34ch;font-size:clamp(17px,2vw,20px);font-weight:300;line-height:1.6;color:#d8d2c7;text-wrap:balance}

.stories{list-style:none;margin:56px 0 0;padding:0;display:grid;gap:40px 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
.story a{display:block;color:inherit;text-decoration:none}
.story .pic{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:#000}
.story img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.9);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s ease}
.story a:hover img,.story a:focus-visible img{transform:scale(1.025);filter:brightness(1)}
.story h2{margin:18px 0 0;font:400 17px/1.2 var(--f-mark);letter-spacing:.2em;text-transform:uppercase;transition:color .2s ease}
.story a:hover h2,.story a:focus-visible h2{color:var(--gold)}
.story p{margin:6px 0 0;font-size:14px;color:var(--dim)}
.story a:focus-visible{outline:1px solid var(--gold);outline-offset:8px}

footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;color:var(--dim)}
footer svg{width:30px;height:auto;display:block}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(226,164,70,.4);transition:color .2s ease,border-color .2s ease}
footer a:hover{color:var(--gold);border-bottom-color:var(--gold)}
/* The subtitle types itself out, slow at first and quickening, a gold caret after the last key struck.
   The untyped rest is laid out but hidden, so the line never shifts. Without script, or with reduced motion, it simply shows. */
.kind .rest{visibility:hidden}
.kind .caret{display:inline-block;width:0;height:1.25em;margin-right:-1px;vertical-align:-.2em;border-left:1px solid var(--gold)}
.kind .caret.done{animation:blink 1.1s steps(1) 3 forwards}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.story img,.story h2{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="mark" aria-label="Between the Lines"><span>Between <svg class="the" viewBox="0 0 8103.84 1536" aria-hidden="true"><rect class="b b1" x="94" y="0" width="1728" height="160"/><rect x="862" y="160" width="192" height="1376"/><rect x="2849.28" y="0" width="192" height="1536"/><rect x="4449.28" y="0" width="192" height="1536"/><rect class="b b2" x="3041.28" y="672" width="1408" height="160"/><rect x="5766.56" y="0" width="192" height="1536"/><rect x="5958.56" y="0" width="1316" height="160"/><rect class="b b3" x="5958.56" y="672" width="1261" height="160"/><rect x="5958.56" y="1376" width="1344" height="160"/></svg> Lines</span></h1>
    <p class="kind">experiments in storytelling</p>
    <p class="line">More than the story, I'm amazed by the storyteller. A voice pours life into a story.</p>
  </header>
  <script>
  (() => {
    // type "experiments in storytelling": each keystroke a little quicker than the last
    const el = document.querySelector(".kind");
    if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const text = el.textContent;
    el.setAttribute("aria-label", text);
    const typed = document.createElement("span");
    const caret = document.createElement("span");
    const rest = document.createElement("span");
    caret.className = "caret"; rest.className = "rest"; rest.textContent = text;
    for (const s of [typed, caret, rest]) s.setAttribute("aria-hidden", "true");
    el.replaceChildren(typed, caret, rest);
    let n = 0, t = 260;                  // first keystroke 260 ms, each next 3% quicker, to a floor of 130 ms
    const key = () => {
      n++;
      typed.textContent = text.slice(0, n);
      rest.textContent = text.slice(n);
      if (n < text.length) { setTimeout(key, t); t = Math.max(130, t * 0.97); }
      else caret.classList.add("done");  // blink three times, then go
    };
    setTimeout(key, 500);
  })();
  </script>
  <ul class="stories">
    <li class="story">
      <a href="kali/">
        <span class="pic"><img src="assets/kali.jpg" width="1200" height="675" alt="Kali's dark hand spread across the sky above an army of kings"></span>
        <h2>KALI</h2>
        <p>a short story · 7½ min</p>
      </a>
    </li>
    <li class="story">
      <a href="change/">
        <span class="pic"><img src="assets/change.jpg" width="1200" height="675" alt="Two worlds painted in gold and blue under two yellow suns" loading="lazy"></span>
        <h2>Change</h2>
        <p>a space-opera essay · 3½ min</p>
      </a>
    </li>
  </ul>
  <footer>
    <svg viewBox="0 -78 2423 806" aria-hidden="true"><g fill="#f3efe7"><path d="M70 650V10H700Q894 10 986.0 48.0Q1078 86 1078 180Q1078 240 1038.5 272.0Q999 304 925.5 316.5Q852 329 749 332L757 324Q832 324 896.0 328.0Q960 332 1008.0 346.0Q1056 360 1083.0 389.0Q1110 418 1110 469Q1110 531 1066.0 571.0Q1022 611 941.0 630.5Q860 650 750 650ZM320 462H750Q803 462 826.5 452.0Q850 442 850 420Q850 405 839.5 396.0Q829 387 807.0 382.5Q785 378 750 378H320ZM320 282H708Q761 282 784.5 272.0Q808 262 808 240Q808 217 784.5 207.5Q761 198 708 198H320Z"/><path d="M1840 10V460H2423V650H1590V10Z"/></g><rect x="1300" y="-78" width="60" height="806" fill="#e2a446"/></svg>
    <span>&copy; 2026 <a href="/">Krishna Somandepalli</a></span>
  </footer>
</main>
</body>
</html>
