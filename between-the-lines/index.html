<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Between the Lines. The mark: the name in Michroma, wide and spaced, held between two rules, with "the" in lamp gold.
   The B|L monogram (Syne ExtraBold outlines, gold bar) is the icon and signs the footer. Night ground, as in the films. */
@font-face{font-family:"Michroma";font-display:swap;src:url("assets/fonts/michroma.woff") format("woff")}
:root{
  --night:#0f0f0f;
  --ink:#f3efe7;
  --dim:#a39d92;
  --gold:#e2a446;
  --rule:rgba(243,239,231,.7);
  --hair:#2b2a28;
  --f-mark:"Michroma",system-ui,sans-serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-text);line-height:1.6;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
main{max-width:1080px;margin:0 auto}

header{text-align:center}
/* The mark scales with the screen so it never wraps: its width is about 22 of its own letters. */
.mark{display:inline-block;font-size:clamp(12px,calc((100vw - 48px) / 23),26px);margin:0}
.mark::before,.mark::after{content:"";display:block;height:1px;background:var(--rule)}
.mark span{display:block;white-space:nowrap;font:400 1em/1 var(--f-mark);letter-spacing:.36em;text-transform:uppercase;
  padding:.9em .5em .9em calc(.5em + .36em)}
.mark i{font-style:normal;color:var(--gold)}
.kind{margin:22px 0 0;white-space:nowrap;font:400 clamp(9px,calc((100vw - 48px) / 34),11px)/1 var(--f-mark);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.line{margin:30px auto 0;max-width:34ch;font-size:clamp(17px,2vw,20px);font-weight:300;line-height:1.6;color:#d8d2c7;text-wrap:balance}

.stories{list-style:none;margin:56px 0 0;padding:0;display:grid;gap:40px 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
.story a{display:block;color:inherit;text-decoration:none}
.story .pic{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:#000}
.story img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.9);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s ease}
.story a:hover img,.story a:focus-visible img{transform:scale(1.025);filter:brightness(1)}
.story h2{margin:18px 0 0;font:400 17px/1.2 var(--f-mark);letter-spacing:.2em;text-transform:uppercase;transition:color .2s ease}
.story a:hover h2,.story a:focus-visible h2{color:var(--gold)}
.story p{margin:6px 0 0;font-size:14px;color:var(--dim)}
.story a:focus-visible{outline:1px solid var(--gold);outline-offset:8px}

footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;color:var(--dim)}
footer svg{width:30px;height:auto;display:block}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(226,164,70,.4);transition:color .2s ease,border-color .2s ease}
footer a:hover{color:var(--gold);border-bottom-color:var(--gold)}
@media (prefers-reduced-motion:reduce){.story img,.story h2{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="mark"><span>Between <i>the</i> Lines</span></h1>
    <p class="kind">experiments in storytelling</p>
    <p class="line">More than the story, I'm amazed by the storyteller. A voice pours life into a story.</p>
  </header>
  <ul class="stories">
    <li class="story">
      <a href="kali/">
        <span class="pic"><img src="assets/kali.jpg" width="1200" height="675" alt="Kali's dark hand spread across the sky above an army of kings"></span>
        <h2>KALI</h2>
        <p>a short story · 7½ min</p>
      </a>
    </li>
    <li class="story">
      <a href="change/">
        <span class="pic"><img src="assets/change.jpg" width="1200" height="675" alt="Two worlds painted in gold and blue under two yellow suns" loading="lazy"></span>
        <h2>Change</h2>
        <p>a space-opera essay · 3½ min</p>
      </a>
    </li>
  </ul>
  <footer>

    <span>&copy; 2026 <a href="/">Krishna Somandepalli</a></span>
  </footer>
</main>
</body>
</html>
