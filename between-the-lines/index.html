<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Between the Lines · Krishna Somandepalli</title>
<meta name="description" content="Experiments in storytelling by Krishna Somandepalli.">
<meta name="author" content="Krishna Somandepalli">
<link rel="canonical" href="https://krishnasomandepalli.com/between-the-lines/">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Between the Lines">
<meta property="og:description" content="Experiments in storytelling by Krishna Somandepalli.">
<meta property="og:url" content="https://krishnasomandepalli.com/between-the-lines/">
<meta property="og:image" content="https://krishnasomandepalli.com/between-the-lines/assets/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
/* Between the Lines: the homepage's own theme (its colours, type, cards and links), so the two read as one site. */
:root{
  --accent-color:#003366; /* Deep Navy, as on the homepage */
  --link-hover:#800020;   /* Burgundy, as on the homepage */
  --bg-color:#ffffff;
  --text-color:#333333;
  --muted:#62666b;
  --border-color:#e9ecef;
  --card-border:#e3e6ea;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg-color);color:var(--text-color);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:calc(3rem + env(safe-area-inset-top,0px)) max(1.25rem,env(safe-area-inset-right,0px)) calc(3rem + env(safe-area-inset-bottom,0px)) max(1.25rem,env(safe-area-inset-left,0px))}
main{max-width:1080px;margin:0 auto}
header{text-align:center;margin-bottom:2.5rem}
h1{color:var(--accent-color);font-size:clamp(1.9rem,4.5vw,2.6rem);font-weight:700;line-height:1.2;margin:0}
.kind{color:var(--muted);font-size:.85rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin:.6rem 0 0}
.line{font-size:clamp(1.05rem,1.8vw,1.2rem);max-width:36ch;margin:1.4rem auto 0;text-wrap:balance}
.stories{list-style:none;margin:0;padding:0;display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
.story a{display:block;height:100%;background:#fff;border:1px solid var(--card-border);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;
  transition:border-color .2s ease,box-shadow .2s ease}
.story a:hover,.story a:focus-visible{border-color:rgba(128,0,32,.35);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.story a:focus-visible{outline:2px solid var(--accent-color);outline-offset:3px}
.story img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#0b0907}
.story .text{padding:1.1rem 1.5rem 1.35rem}
.story h2{color:#222;font-size:1.35rem;font-weight:700;line-height:1.35;margin:0}
.story a:hover h2{color:var(--link-hover)}
.story p{margin:.35rem 0 0;color:var(--muted);font-size:.85rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
footer{text-align:center;font-size:.8rem;color:#666;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border-color)}
footer a{color:var(--text-color);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(0,51,102,.3);transition:color .2s ease,border-color .2s ease}
footer a:hover{color:var(--link-hover);border-bottom-color:var(--link-hover)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Between the Lines</h1>
    <p class="kind">experiments in storytelling</p>
    <p class="line">More than the story, I'm amazed by the storyteller. A voice pours life into a story.</p>
  </header>
  <ul class="stories">
    <li class="story">
      <a href="kali/">
        <img src="assets/kali.jpg" width="1200" height="675" alt="Kali's dark hand spread across the sky above an army of kings">
        <div class="text"><h2>KALI</h2><p>a short story · 7½ min</p></div>
      </a>
    </li>
    <li class="story">
      <a href="change/">
        <img src="assets/change.jpg" width="1200" height="675" alt="Two worlds painted in gold and blue under two yellow suns" loading="lazy">
        <div class="text"><h2>Change</h2><p>a space-opera essay · 3½ min</p></div>
      </a>
    </li>
  </ul>
  <footer><a href="/">Krishna Somandepalli</a></footer>
</main>
</body>
</html>
