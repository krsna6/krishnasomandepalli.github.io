<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050506">
<title>Gray sky · in the sand</title>
<link rel="stylesheet" href="../shell.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="cap" aria-live="off"></div>
<div class="bar"><button id="bPlay" type="button">Play</button><button id="bRestart" type="button">Restart</button><button id="bCap" type="button">Words: on</button></div>
<div class="start" id="start"><div><h1>Study · in the sand</h1><h2>Gray sky</h2><p>You are low on a dune; her voice lifts the sand around you, word by word. About a minute, with sound.</p><button id="begin" type="button">Begin</button></div></div>
<script type="module">
/*
 * In the sand. You are low on a dune at dusk, drifting slowly forward; the light is the last of the day,
 * raking across the ripples, and it fades to gray as the essay does. Her words lift the sand around you,
 * simulated on the graphics card (65,536 grains on a phone, 147,456 elsewhere), stepped at 120 Hz up to her
 * voice's clock; grains near you pass out of focus, large and soft, as through a lens.
 * Each word throws grains up, from the voice's own measures, normalised to this take's range:
 *   loudness (p10..p95 -> 0..1)  how high and how many, and how near you (louder lands closer)
 *   pitch    (p10..p90 -> 0..1)  where across the dune (low left, high right)
 *   pitch slope                  which way the plume swirls
 *   length of the word           how wide the plume is
 * Every "hope" lightens the air and puts blue into the light: the sand stops falling and hangs around you.
 * "...shall pass." lets half of it go; "Hope...", after the silence, throws one tall plume ahead of you;
 * at "distraction" the air gives out and everything comes down, and the light goes gray.
 */
import * as THREE from "../three.module.min.js";
import { VOICE, runStudy } from "../shell.js";
import { createPost } from "../post.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const post = createPost(renderer, { bloom: 0.8, threshold: 0.75, grain: 0.05, vignette: 0.55, exposure: 1.0, tint: [1.0, 0.98, 0.95] });
const gl = renderer.getContext();
const FLOAT_OK = !!gl.getExtension("EXT_color_buffer_float");
const SIDE = matchMedia("(pointer: coarse)").matches ? 256 : 384;
const N = SIDE * SIDE;

// the dune: the same height everywhere it is asked for (CPU, simulation, drawing)
const H_GLSL = `float dune(vec2 p){ return 0.22 * sin(0.31 * p.x + 0.17 * p.y) + 0.12 * sin(0.53 * p.y - 0.21 * p.x + 1.3) + 0.05 * sin(1.1 * p.x + 0.7 * p.y + 2.0); }`;
const dune = (x, z) => 0.22 * Math.sin(0.31 * x + 0.17 * z) + 0.12 * Math.sin(0.53 * z - 0.21 * x + 1.3) + 0.05 * Math.sin(1.1 * x + 0.7 * z + 2.0);

// ---- the light over the essay: warm and low at first, gray by "true nature", a blue lift on each hope
const W = VOICE.words;
const iGray = W.findIndex((w) => w.t.startsWith("nature"));
const iLastHope = W.findIndex((w) => w.t.startsWith("Hope..."));
const iPass = W.findIndex((w) => w.t === "pass.");
const iFall = W.findIndex((w, i) => i > iLastHope && w.t.startsWith("distraction"));
const tGrayFrom = W[2].s, tGrayTo = W[iGray].e;

// ---- the simulation state
const rtOpts = { type: FLOAT_OK ? THREE.FloatType : THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false };
let pos = [new THREE.WebGLRenderTarget(SIDE, SIDE, rtOpts), new THREE.WebGLRenderTarget(SIDE, SIDE, rtOpts)];
let vel = [new THREE.WebGLRenderTarget(SIDE, SIDE, rtOpts), new THREE.WebGLRenderTarget(SIDE, SIDE, rtOpts)];
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const P0 = new Float32Array(N * 4), V0 = new Float32Array(N * 4);
{
  const R = mulberry(20261025);
  for (let i = 0; i < N; i++) {
    const x = (R() * 2 - 1) * 6.5, z = 1.5 - R() * 16;
    P0[i * 4] = x; P0[i * 4 + 1] = dune(x, z) + 0.005; P0[i * 4 + 2] = z; P0[i * 4 + 3] = 1;
    V0[i * 4 + 3] = R();
  }
}
const tex = (d) => { const t = new THREE.DataTexture(d, SIDE, SIDE, THREE.RGBAFormat, THREE.FloatType); t.needsUpdate = true; return t; };
const initPos = tex(P0), initVel = tex(V0);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quadScene.add(quad);
const VS = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
const copyMat = new THREE.ShaderMaterial({ uniforms: { t: { value: null } }, vertexShader: VS, fragmentShader: "uniform sampler2D t; varying vec2 vUv; void main(){ gl_FragColor = texture2D(t, vUv); }" });
const IMP = 4;
const velMat = new THREE.ShaderMaterial({
  uniforms: { tPos: { value: null }, tVel: { value: null }, dt: { value: 1 / 120 }, time: { value: 0 }, suspend: { value: 0 }, camZ: { value: 0 }, nImp: { value: 0 },
    imp: { value: Array.from({ length: IMP }, () => new THREE.Vector4()) }, impB: { value: Array.from({ length: IMP }, () => new THREE.Vector4()) } },
  vertexShader: VS,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tPos, tVel; uniform float dt, time, suspend, camZ; uniform int nImp; uniform vec4 imp[${IMP}], impB[${IMP}];
    varying vec2 vUv;
    ${H_GLSL}
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    vec3 wind(vec3 p, float t){
      return vec3(sin(p.y * 1.3 + t * 0.31) * cos(p.z * 0.9 - t * 0.23) + 0.5 * sin(p.y * 2.7 - t * 0.5),
                  sin(p.z * 0.9 + t * 0.27) * cos(p.x * 0.6 + t * 0.19) * 0.6,
                  sin(p.x * 0.9 - t * 0.21) * cos(p.y * 1.3 + t * 0.29));
    }
    void main(){
      vec4 P = texture2D(tPos, vUv), V = texture2D(tVel, vUv);
      vec3 p = P.xyz, v = V.xyz; float rest = P.w, seed = V.w;
      for (int k = 0; k < ${IMP}; k++) {
        if (k >= nImp) break;
        vec2 d = p.xz - imp[k].xy; float dist = length(d);
        if (dist < imp[k].z && rest > 0.5 && hash(vec2(seed * 91.7, impB[k].z)) < impB[k].y) {
          float f = pow(1.0 - dist / imp[k].z, 0.5) * imp[k].w * (0.55 + 0.45 * hash(vec2(seed, impB[k].z + 3.1)));
          float ang = 6.2831853 * hash(vec2(seed * 7.3, impB[k].z + 1.7));
          vec2 own = vec2(cos(ang), sin(ang));
          vec2 tang = (dist > 1e-4 ? vec2(-d.y, d.x) / dist : own) * impB[k].x;
          v = vec3((own * 0.35 + tang * 0.35) * f * 0.45, f * (0.7 + 0.6 * hash(vec2(seed * 3.1, impB[k].z + 5.3))));
          rest = 0.0;
        }
      }
      if (rest < 0.5) {
        float g = dune(p.xz);
        v.y -= 2.4 * (1.0 - 0.92 * suspend) * dt;
        v += wind(p, time) * (0.3 + 1.4 * suspend) * dt;
        // hope holds them at eye height, around you
        float band = g + 0.35 + 1.1 * fract(seed * 13.7);
        v.y += suspend * (band - p.y) * 1.8 * dt;
        v.x -= p.x * 0.06 * (0.3 + suspend) * dt;
        v.z -= (p.z - (camZ - 4.0)) * 0.05 * suspend * dt;
        v *= exp(-0.9 * dt);
      } else v = vec3(0.0);
      gl_FragColor = vec4(v, seed);
    }`,
});
const posMat = new THREE.ShaderMaterial({
  uniforms: { tPos: { value: null }, tVel: { value: null }, dt: { value: 1 / 120 } }, vertexShader: VS,
  fragmentShader: `
    precision highp float; uniform sampler2D tPos, tVel; uniform float dt; varying vec2 vUv;
    ${H_GLSL}
    void main(){
      vec4 P = texture2D(tPos, vUv), V = texture2D(tVel, vUv);
      vec3 p = P.xyz; float rest = P.w;
      if (dot(V.xyz, V.xyz) > 0.0) rest = 0.0;
      if (rest < 0.5) {
        p += V.xyz * dt;
        float ground = dune(p.xz) + 0.005;
        if (p.y <= ground && V.y <= 0.0) { p.y = ground; rest = 1.0; }
      }
      gl_FragColor = vec4(p, rest);
    }`,
});
function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); renderer.setRenderTarget(null); }

const DT = 1 / 120;
const hopeTimes = W.filter((w, i) => w.hope && i !== iLastHope).map((w) => w.s);
let simT, suspend, target, tau, nextHope, camZ, blue;
function reset() {
  copyMat.uniforms.t.value = initPos; pass(copyMat, pos[0]);
  copyMat.uniforms.t.value = initVel; pass(copyMat, vel[0]);
  simT = 0; suspend = 0; target = 0; tau = 1.4; nextHope = 0; camZ = 2.2; blue = 0;
}
function step() {
  const t = simT;
  while (nextHope < hopeTimes.length && hopeTimes[nextHope] <= t) { target = Math.min(1, target + 0.2); blue = Math.min(1, blue + 0.45); nextHope++; }
  if (t >= W[iPass].s && t < W[iPass].s + DT) target *= 0.5;
  if (t >= W[iFall].s) { target = 0; tau = 0.5; }
  suspend += (target - suspend) * (1 - Math.exp(-DT / tau));
  blue *= Math.exp(-DT / 3);
  camZ -= DT * (t > W[iFall].s ? 0.02 : 0.085);
  const act = [];
  W.forEach((w, i) => { if (w.s <= t && t <= w.e && act.length < IMP) act.push([w, i]); });
  const u = velMat.uniforms;
  u.nImp.value = act.length;
  act.forEach(([w, i], k) => {
    const L = Math.pow(w.L, 1.4), P = w.P ?? 0.5;
    const plume = i === iLastHope;
    const h = Math.abs((Math.sin(i * 12.9898) * 43758.5453) % 1);
    const x = plume ? 0.2 : (P - 0.5) * 6;
    const z = camZ - (plume ? 5.5 : 1.8 + 7 * (1 - L) * (0.4 + 0.6 * h));
    const r = plume ? 0.35 : 0.7 + 1.2 * Math.min(1, (w.e - w.s) / 0.6);
    const strength = plume ? 4.6 : 1.2 + 2.6 * L;
    u.imp.value[k].set(x, z, r, strength);
    u.impB.value[k].set((w.S ?? 1) >= 0 ? 1 : -1, plume ? 0.95 : 0.35 + 0.55 * L, i + 0.5, w.s);
  });
  u.tPos.value = pos[0].texture; u.tVel.value = vel[0].texture; u.time.value = t; u.suspend.value = suspend; u.camZ.value = camZ;
  pass(velMat, vel[1]);
  posMat.uniforms.tPos.value = pos[0].texture; posMat.uniforms.tVel.value = vel[1].texture;
  pass(posMat, pos[1]);
  pos = [pos[1], pos[0]]; vel = [vel[1], vel[0]];
  simT += DT;
}
function stepTo(T) {
  if (T < simT - 1e-6) reset();
  let n = 0;
  while (simT + DT <= T && n++ < 12) step();
}

// ---- the world: sky, dune and dust, lit by one low light that changes over the essay
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 80);
const light = { dir: new THREE.Vector3(-0.92, 0.2, -0.33).normalize(), col: new THREE.Vector3(), amb: new THREE.Vector3() };
const common = { lightDir: { value: light.dir }, lightCol: { value: light.col }, amb: { value: light.amb }, eye: { value: new THREE.Vector3() } };

const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.ShaderMaterial({
  uniforms: common, side: THREE.BackSide, depthWrite: false,
  vertexShader: "varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform vec3 lightDir, lightCol, amb; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float hz = exp(-abs(d.y) * 9.0);
      float sun = pow(max(dot(d, lightDir), 0.0), 6.0);
      vec3 c = amb * 0.6 * (0.3 + hz) + lightCol * (0.10 * hz + 0.35 * sun * hz);
      gl_FragColor = vec4(c, 1.0); }`,
}));
scene.add(sky);

const floorGeo = new THREE.PlaneGeometry(60, 60, 240, 240);
floorGeo.rotateX(-Math.PI / 2);
const floorMat = new THREE.ShaderMaterial({
  uniforms: common,
  vertexShader: `${H_GLSL}
    varying vec3 vPos;
    void main(){ vec3 p = position; p.y = dune(p.xz); vPos = p; gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0); }`,
  fragmentShader: `precision highp float;
    uniform vec3 lightDir, lightCol, amb, eye; varying vec3 vPos;
    ${H_GLSL}
    float rippleAmp = 1.0;
    float ripple(vec2 p){ float w = p.x * 0.8 + p.y * 0.6 + 0.35 * sin(p.y * 1.3 + p.x * 0.4); return (sin(w * 9.0) * 0.012 + sin(w * 23.0 + p.x) * 0.003) * rippleAmp; }
    float hgt(vec2 p){ return dune(p) + ripple(p); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = vPos.xz; float e = 0.01;
      rippleAmp = exp(-0.22 * length(vPos - eye));   // ripples fade with distance, before they can shimmer
      vec3 n = normalize(vec3(hgt(p - vec2(e, 0.0)) - hgt(p + vec2(e, 0.0)), 2.0 * e, hgt(p - vec2(0.0, e)) - hgt(p + vec2(0.0, e))));
      vec3 sand = vec3(0.42, 0.35, 0.27);
      float dif = max(dot(n, lightDir), 0.0);
      vec3 v = normalize(eye - vPos);
      float sparkle = step(0.996, hash(floor(p * 260.0))) * pow(max(dot(reflect(-lightDir, n), v), 0.0), 8.0);
      vec3 c = sand * (lightCol * dif * 1.4 + amb * 0.35) + lightCol * sparkle * 1.5;
      float dist = length(vPos - eye);
      vec3 fogc = amb * 0.25 + lightCol * 0.05;
      c = mix(fogc, c, exp(-0.09 * dist));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
scene.add(new THREE.Mesh(floorGeo, floorMat));

const refs = new Float32Array(N * 2);
for (let i = 0; i < N; i++) { refs[i * 2] = ((i % SIDE) + 0.5) / SIDE; refs[i * 2 + 1] = (Math.floor(i / SIDE) + 0.5) / SIDE; }
const pg = new THREE.BufferGeometry();
pg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 3), 3));
pg.setAttribute("ref", new THREE.BufferAttribute(refs, 2));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { ...common, tPos: { value: null }, px: { value: 1 }, focus: { value: 3.2 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D tPos; uniform float px, focus; uniform vec3 lightDir, lightCol, amb, eye;
    attribute vec2 ref; varying vec3 vCol; varying float vSoft;
    void main(){
      vec4 P = texture2D(tPos, ref);
      if (P.w > 0.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }   // at rest it is part of the dune
      vec4 mv = modelViewMatrix * vec4(P.xyz, 1.0);
      gl_Position = projectionMatrix * mv;
      float dist = -mv.z;
      float sharp = px * 0.018 / dist;                       // a grain's own size on screen
      float coc = px * 0.0055 * abs(dist - focus) / dist;     // the lens: out of focus, a soft disc
      float size = max(1.0, sharp + coc);
      gl_PointSize = size;
      vSoft = clamp(coc / size, 0.0, 1.0);
      // sunlit dust glows when the light is behind it (forward scattering)
      vec3 v = normalize(eye - P.xyz);
      float fwd = pow(max(dot(-v, lightDir), 0.0), 3.0);
      vec3 col = lightCol * (0.6 + 2.2 * fwd) + amb * 0.5;
      float energy = min(1.0, (sharp * sharp + 2.0) / (size * size));   // the same light spread over a larger disc
      vCol = col * energy * 0.65;
    }`,
  fragmentShader: `varying vec3 vCol; varying float vSoft;
    void main(){ vec2 c = gl_PointCoord - 0.5; float r = length(c) * 2.0; if (r > 1.0) discard;
      float a = mix(1.0 - r * r, smoothstep(1.0, 0.82, r) * (0.75 + 0.25 * r), vSoft);
      gl_FragColor = vec4(vCol * a, 1.0); }`,
});
const dust = new THREE.Points(pg, dustMat);
dust.frustumCulled = false;
scene.add(dust);

const WARM = new THREE.Vector3(1.0, 0.6, 0.32).multiplyScalar(1.5), GRAY = new THREE.Vector3(0.5, 0.55, 0.62).multiplyScalar(0.55);
const BLUE = new THREE.Vector3(0.35, 0.55, 1.0);
let aspect = 1;
function resize(w, h) {
  renderer.setSize(w, h, false);
  post.setSize(w, h);
  aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 64 : 48;
  camera.updateProjectionMatrix();
  dustMat.uniforms.px.value = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
function render(T) {
  const k = THREE.MathUtils.smoothstep(T, tGrayFrom, tGrayTo);
  light.col.copy(WARM).lerp(GRAY, k);
  if (T > W[iFall].s) light.col.multiplyScalar(1 - 0.45 * Math.min(1, (T - W[iFall].s) / 3));
  light.amb.set(0.05, 0.055, 0.07).addScaledVector(BLUE, 0.16 * blue);
  light.col.addScaledVector(BLUE, 0.35 * blue);
  const x = 0.25 * Math.sin(T * 0.09);
  const y = dune(x, camZ) + 0.42 + 0.04 * Math.sin(T * 0.21);
  camera.position.set(x, y, camZ);
  camera.lookAt(x * 0.4 - 0.2, dune(0, camZ - 6) + 0.55, camZ - 6);
  common.eye.value.copy(camera.position);
  sky.position.copy(camera.position);
  dustMat.uniforms.tPos.value = pos[0].texture;
  post.render(scene, camera, T);
}

window.__study = { reset, stepTo, render, resize, state: () => ({ simT, suspend: +suspend.toFixed(3), camZ: +camZ.toFixed(2), side: SIDE }) };
runStudy(window.__study);
</script>
</body>
</html>
