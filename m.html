<style>
/* Werk (mock). An anatomical figure in clay grey, the trained muscles heated orange to red by a week of
   training. The anatomy is the Z-Anatomy atlas (from BodyParts3D), shown as it is: nothing is redrawn. */
:root{
  --ground:#dddddf; --ink:#1d2126; --dim:#6b7380; --line:#d5d9df; --card:#ffffff;
  --hot:#d7351f; --warm:#ee8a5a;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.title h1{margin:0;font:800 15px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.title p{margin:6px 0 0;font-size:12.5px;color:var(--dim)}
.week{display:flex;align-items:center;gap:2px;margin:4px 0 0 -8px;pointer-events:auto}
.arrow{font:400 20px/1 var(--f);color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:6px}
.arrow:disabled{opacity:.3;cursor:default}
.arrow:focus-visible{outline:2px solid var(--hot)}
.card{pointer-events:none;min-width:150px;max-width:220px;background:var(--card);box-shadow:0 6px 24px rgba(20,24,30,.12);text-align:center;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.card.on{opacity:1;transform:none}
.card h2{margin:0;background:var(--hot);color:#fff;font:800 14px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;padding:9px 12px}
.card ul{list-style:none;margin:0;padding:9px 12px 4px;font:600 11.5px/1.5 var(--f);letter-spacing:.08em;text-transform:uppercase}
.card li.lit{color:var(--hot)}
.card .sets{padding:0 12px 10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
/* the dock: one frosted bar at the thumb, play on the left, the week, turn on the right */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:7px;justify-items:center;transition:opacity .35s,transform .35s}
.session{font-size:12.5px;color:var(--dim);text-align:center;min-height:1.4em;max-width:560px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.session button{font:inherit;color:var(--hot);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.session b{color:var(--ink);font-weight:650}
.session .watch{color:#9aa1ab}
.days button .rib{position:absolute;left:8px;bottom:2px;height:2px;max-width:calc(100% - 16px);border-radius:1px;background:rgba(29,33,38,.18)}
.days button.cur .rib{background:rgba(255,255,255,.55)}
.dock{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(30,36,46,.10),0 1px 0 rgba(30,36,46,.04);border-radius:999px;padding:5px}
.days{display:flex;gap:2px}
.days button{position:relative;font:600 12px/1 var(--f);color:var(--dim);background:none;border:0;border-radius:999px;height:36px;min-width:38px;padding:0 8px;cursor:pointer;transition:background .2s,color .2s}
.days button.done{color:var(--ink)}
.days button.cur{background:var(--ink);color:#fff}
.days button.trained::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--hot)}
.days button.cur.trained::after{background:#fff}
.round{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0;transition:background .2s}
.round:hover{background:rgba(29,33,38,.06)}
.round svg{width:18px;height:18px;fill:var(--ink)}
#bPlay{background:var(--hot)}
#bPlay svg{fill:#fff}
#bPlay:hover{background:#c22d18}
.chip{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 16px rgba(30,36,46,.08);cursor:pointer;padding:0;pointer-events:auto}
.chip svg{width:18px;height:18px;fill:var(--ink)}
.days button:focus-visible,.round:focus-visible,.chip:focus-visible,.arrow:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.right{display:grid;justify-items:end;gap:10px}
.legend{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.legend .bar{position:relative;display:block}
.legend i{display:block;width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,#c4c7cc 0 3%,#eea27b 3%,#ea6a43 50%,#b8141c)}
.legend .hitkey{display:flex;align-items:center;gap:5px;margin-left:6px}.legend .hitkey i{width:9px;height:9px;border-radius:50%;background:#d9a441}
.legend b{position:absolute;left:65%;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:12.5px;letter-spacing:.04em;color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
.credit{font-size:9.5px;color:#9aa1ab}
.credit a{color:inherit}
/* immersive: only the figure, and one quiet way out */
.top,.bottom{transition:opacity .35s,transform .35s}
body.immersive .top .title,body.immersive .bottom{opacity:0;pointer-events:none;transform:translateY(8px)}
body.immersive .card{opacity:0}
body.immersive #bFull{opacity:.55}
/* the muscles panel: every group, region by region, with its week; pick one to see it on the body */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:5;display:flex;flex-direction:column;background:rgba(250,251,252,.86);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-left:1px solid rgba(255,255,255,.9);box-shadow:-12px 0 40px rgba(30,36,46,.10);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px 10px 18px}
.ph h2{margin:0;font:800 13px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.ph p{margin:5px 0 0;font-size:12px;color:var(--dim)}
.pl{overflow-y:auto;padding:0 10px 18px;-webkit-overflow-scrolling:touch}
.rg{margin:14px 8px 6px;font:700 10.5px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.gr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer}
.gr:hover{background:rgba(29,33,38,.05)}
.gr.sel{background:#fff;box-shadow:0 2px 10px rgba(30,36,46,.08)}
.gr .n{font-size:13.5px;font-weight:600}
.gr .n i{font-style:normal;font-weight:400;font-size:11px;color:var(--dim)}
.gr .v{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.gr .v.hit,.det .hit{color:#b07e22}
.gr .v.zero{color:#a3a9b2;font-weight:500}
.gr .wk{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.gr .wk span{height:6px;border-radius:2px;background:#e3e6ea}
.gr .wk span.today{box-shadow:0 0 0 1px rgba(29,33,38,.35)}
.det{grid-column:1/-1;margin:4px 0 2px;font-size:12px;color:var(--dim);line-height:1.5}
.det b{color:var(--ink);font-weight:600}
.det .parts{font-size:11px;letter-spacing:.02em}
.det ul{list-style:none;margin:6px 0 0;padding:0}
.det li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.chips{display:grid;gap:10px;justify-items:end}
#bMuscles svg{width:19px;height:19px}
body.immersive .chips #bMuscles{opacity:0;pointer-events:none}
@media (max-width:520px){.days button{min-width:32px;padding:0 5px}.legend i{width:80px}.card{min-width:130px}}
@media (prefers-reduced-motion:reduce){.top,.bottom,.card,.days button{transition:none}}
</style>

  addModel(hd, "head");
  // the eyes: the atlas has the muscles that move each eye but not the globe. A globe of 12 mm radius (an adult eye
  // is about 24 mm long) sits where the four recti converge, its front just ahead of where they insert
  for (const side of ["l", "r"]) {
    const rs = man.muscles.filter((o) => /^(Superior|Inferior|Medial|Lateral) rectus muscle\.(l|r)$/.test(o.name) && o.name.endsWith("." + side));
    if (rs.length !== 4) continue;
    const mn = [0, 1, 2].map((i) => Math.min(...rs.map((o) => o.min[i]))), mx = [0, 1, 2].map((i) => Math.max(...rs.map((o) => o.max[i])));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.012, 32, 24), SKIN);
    eye.position.set((mn[0] + mx[0]) / 2, (mn[2] + mx[2]) / 2, -(mn[1] + 0.004));   // atlas z-up, -y forward -> three
    scene.add(eye);
  }
  addModel(sk, "skeleton");
  addModel(mu, "muscles");
  // the linea alba: the atlas leaves the band of tendon between the two recti open (its sheath is not drawn), so
  // the spine shows through. Each rectus gets a tendon-white copy slid to the midline and set just behind it
  scene.updateMatrixWorld(true);
  for (const m of parts.get("Rectus abdominis muscle") || []) {
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld), P = g.attributes.position;
    const band = new Map();   // per 1 cm of height, the rectus's nearest approach to the midline
    for (let i = 0; i < P.count; i++) { const k = Math.round(P.getY(i) * 100), x = Math.abs(P.getX(i)); band.set(k, Math.min(band.get(k) ?? 1, x)); }
    const gap = Math.max(...band.values()), sign = Math.sign(g.boundingBox?.getCenter(new THREE.Vector3()).x ?? (g.computeBoundingBox(), g.boundingBox.getCenter(new THREE.Vector3()).x));
    g.translate(-sign * (gap + 0.001), 0, 0);
    // flat in depth: the band does not follow the dips where the rectus's tendinous intersections cross it
    const front = new Map();
    for (let i = 0; i < P.count; i++) { const k = Math.round(P.getY(i) * 100); front.set(k, Math.max(front.get(k) ?? -1, P.getZ(i))); }
    const ks = [...front.keys()].sort((a, b) => a - b), smooth = new Map(ks.map((k) => [k, Math.max(...[-2, -1, 0, 1, 2].map((d) => front.get(k + d) ?? -1))]));
    for (let i = 0; i < P.count; i++) P.setZ(i, Math.min(P.getZ(i) + 0.006, smooth.get(Math.round(P.getY(i) * 100)) - 0.003));
    P.needsUpdate = true; g.computeVertexNormals();
    const strip = new THREE.Mesh(g, BEHIND_TENDON); strip.userData.backing = true; scene.add(strip);
  }
  // the fingers and toes: past the palm and sole a digit is bone, tendon and soft tissue with no muscle, so the
  // atlas shows bare phalanges. Each phalanx gets a body of soft tissue: a capsule on the bone's long axis (from its
  // vertices' principal axis), 1.7 times the bone's own girth (a finger is about twice as thick as its phalanx; the palm's
  // metacarpals likewise, so the hand's back reads as one surface)
  const FLESH = behind(new THREE.MeshStandardMaterial({ color: 0xbfc2c7, roughness: 0.6, metalness: 0 }));
  sk.scene.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    const key = ORIGINAL.has(o.name) ? o.name : o.parent?.name, name = ORIGINAL.get(key) || key || o.name;
    if (!/phalanx of .* finger of (hand|foot)|metacarpal bone/.test(name)) return;
    const P = o.geometry.attributes.position, n = P.count, pts = [], c = new THREE.Vector3();
    for (let i = 0; i < n; i++) { const v = new THREE.Vector3().fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); pts.push(v); c.add(v); }
    c.divideScalar(n);
    const C = [0, 0, 0, 0, 0, 0];   // covariance xx xy xz yy yz zz
    for (const v of pts) { const x = v.x - c.x, y = v.y - c.y, z = v.z - c.z; C[0] += x * x; C[1] += x * y; C[2] += x * z; C[3] += y * y; C[4] += y * z; C[5] += z * z; }
    const ax = new THREE.Vector3(0.3, 1, 0.2).normalize();
    for (let k = 0; k < 40; k++) ax.set(C[0] * ax.x + C[1] * ax.y + C[2] * ax.z, C[1] * ax.x + C[3] * ax.y + C[4] * ax.z, C[2] * ax.x + C[4] * ax.y + C[5] * ax.z).normalize();
    let lo = Infinity, hi = -Infinity, rr = 0;
    for (const v of pts) { const d = v.clone().sub(c), t = d.dot(ax); lo = Math.min(lo, t); hi = Math.max(hi, t); rr += d.sub(ax.clone().multiplyScalar(t)).lengthSq(); }
    const r = 1.7 * Math.sqrt(rr / n), len = Math.max(0.001, hi - lo - 0.5 * r);
    const cap = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 16), FLESH);
    cap.position.copy(c).addScaledVector(ax, (hi + lo) / 2);
    cap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ax);
    scene.add(cap);
  });
  const box = new THREE.Box3().setFromObject(mu.scene);
  H = box.max.y - box.min.y; CY = (box.max.y + box.min.y) / 2; bodyZ = (box.max.z + box.min.z) / 2;
  const missing = [...new Set(Object.values(EXERCISES).flatMap((e) => [...e.primary, ...e.secondary, ...e.stabilizers]))].filter((p) => !parts.has(p));
  if (missing.length) console.warn("parts not in the atlas:", missing);
  window.__mm = { selectGroup, setPanel, groups: () => GROUPS, sk: sk.scene, mu: mu.scene, parts, missing, setDay, camera, controls, render: () => composer.render(), turn: (f) => { facing = f; placeCamera(); } };
  document.getElementById("loading").remove();
  placeCamera();
  if (!weekHasWork() && latestEntry && latestEntry < weekDates()[0]) {
    const at = new Date(latestEntry + "T00:00:00Z");
    weekStart = mondayOf(at); await loadLog(); showWeek(); setDay((at.getUTCDay() + 6) % 7); faceFresh();
  } else showWeek();
  tick();
}).catch((e) => { document.getElementById("loading").textContent = "Couldn't load the anatomy: " + e.message; console.error(e); });
</script>
