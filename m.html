<style>
/* Werk (mock). An anatomical figure in clay grey, the trained muscles heated orange to red by a week of
   training. The anatomy is the Z-Anatomy atlas (from BodyParts3D), shown as it is: nothing is redrawn. */
:root{
  --ground:#dddddf; --ink:#1d2126; --dim:#6b7380; --line:#d5d9df; --card:#ffffff;
  --hot:#d7351f; --warm:#ee8a5a;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.title h1{margin:0;font:800 15px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.title p{margin:6px 0 0;font-size:12.5px;color:var(--dim)}
.week{display:flex;align-items:center;gap:2px;margin:4px 0 0 -8px;pointer-events:auto}
.arrow{font:400 20px/1 var(--f);color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:6px}
.arrow:disabled{opacity:.3;cursor:default}
.arrow:focus-visible{outline:2px solid var(--hot)}
.card{pointer-events:none;min-width:150px;max-width:220px;background:var(--card);box-shadow:0 6px 24px rgba(20,24,30,.12);text-align:center;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.card.on{opacity:1;transform:none}
.card h2{margin:0;background:var(--hot);color:#fff;font:800 14px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;padding:9px 12px}
.card ul{list-style:none;margin:0;padding:9px 12px 4px;font:600 11.5px/1.5 var(--f);letter-spacing:.08em;text-transform:uppercase}
.card li.lit{color:var(--hot)}
.card .sets{padding:0 12px 10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
/* the dock: one frosted bar at the thumb, play on the left, the week, turn on the right */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:7px;justify-items:center;transition:opacity .35s,transform .35s}
.session{font-size:12.5px;color:var(--dim);text-align:center;min-height:1.4em;max-width:560px;text-wrap:balance}
.session b{color:var(--ink);font-weight:650}
.dock{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(30,36,46,.10),0 1px 0 rgba(30,36,46,.04);border-radius:999px;padding:5px}
.days{display:flex;gap:2px}
.days button{position:relative;font:600 12px/1 var(--f);color:var(--dim);background:none;border:0;border-radius:999px;height:36px;min-width:38px;padding:0 8px;cursor:pointer;transition:background .2s,color .2s}
.days button.done{color:var(--ink)}
.days button.cur{background:var(--ink);color:#fff}
.days button.trained::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--hot)}
.days button.cur.trained::after{background:#fff}
.round{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0;transition:background .2s}
.round:hover{background:rgba(29,33,38,.06)}
.round svg{width:18px;height:18px;fill:var(--ink)}
#bPlay{background:var(--hot)}
#bPlay svg{fill:#fff}
#bPlay:hover{background:#c22d18}
.chip{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 16px rgba(30,36,46,.08);cursor:pointer;padding:0;pointer-events:auto}

.days button:focus-visible,.round:focus-visible,.chip:focus-visible,.arrow:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.right{display:grid;justify-items:end;gap:10px}
.legend{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.legend .bar{position:relative;display:block}
.legend i{display:block;width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,#c4c7cc,#f0b08c 25%,#ea6a43 55%,#b8141c)}
.legend b{position:absolute;left:50%;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:12.5px;letter-spacing:.04em;color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
.credit{font-size:9.5px;color:#9aa1ab}
.credit a{color:inherit}
/* immersive: only the figure, and one quiet way out */
.top,.bottom{transition:opacity .35s,transform .35s}
body.immersive .top .title,body.immersive .bottom{opacity:0;pointer-events:none;transform:translateY(8px)}
body.immersive .card{opacity:0}
body.immersive #bFull{opacity:.55}
@media (max-width:520px){.days button{min-width:32px;padding:0 5px}.legend i{width:80px}.card{min-width:130px}}
@media (prefers-reduced-motion:reduce){.top,.bottom,.card,.days button{transition:none}}

<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">Loading the anatomy…</div>
<div class="top">

    <div class="card" id="card" aria-live="polite"><h2 id="cardTitle"></h2><ul id="cardParts"></ul><div class="sets" id="cardSets"></div></div>

</div>

    <div class="days" id="days" role="group" aria-label="Day of the week"></div>
    <button class="round" id="bTurn" type="button" aria-label="Turn around"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 0 1 6.9 5.8l1.6-1.6 1.4 1.4-4 4-4-4 1.4-1.4 1.6 1.6A5 5 0 1 0 12 17v2a7 7 0 0 1 0-14z"/></svg></button>
  </div>

  <div class="credit">Anatomy: <a href="https://github.com/Z-Anatomy/Models-of-human-anatomy" target="_blank" rel="noopener">Z-Anatomy</a> from BodyParts3D (DBCLS), CC BY-SA 4.0</div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ---------------------------------------------------------------- the data (m/data; see m/AGENTS.md)
// Weekly load per muscle is counted as fractional sets, the method that fit best in Pelland et al. (2026,
// Sports Medicine): a hard set counts 1 for each primary muscle and 0.5 for each secondary. Stabilisers
// are listed, not counted. Muscle names are the atlas's own anatomical parts.
let EXERCISES = {}, GROUPS = [], groupOf = new Map(), LOG = [];
const ROLE = { primary: 1, secondary: 0.5, stabilizers: 0 };
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const iso = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
// today in New York, as a calendar date
const todayNY = () => { const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date()); return new Date(p + "T00:00:00Z"); };
const mondayOf = (d) => addDays(d, -((d.getUTCDay() + 6) % 7));
let weekStart = mondayOf(todayNY());
const weekDates = () => DAYS.map((_, i) => iso(addDays(weekStart, i)));
const entriesOn = (date) => LOG.filter((e) => e.date === date);
function setsThrough(d) {
  const s = new Map();
  for (const date of weekDates().slice(0, d + 1)) for (const e of entriesOn(date)) {
    const m = EXERCISES[e.exercise]; if (!m || e.unmapped) continue;
    for (const role of ["primary", "secondary"]) for (const p of m[role]) s.set(p, (s.get(p) || 0) + e.sets * ROLE[role]);
  }
  return s;
}
const trainedOn = (d) => { const s = new Set(); for (const e of entriesOn(weekDates()[d])) { const m = EXERCISES[e.exercise]; if (m && !e.unmapped) [...m.primary, ...m.secondary].forEach((p) => s.add(p)); } return s; };
async function loadLog() {
  // the months this week touches
  const months = [...new Set(weekDates().map((d) => d.slice(0, 7)))];
  const docs = await Promise.all(months.map((m) => fetch(`./m/data/log/${m}.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : { entries: [] })).catch(() => ({ entries: [] }))));
  LOG = docs.flatMap((d) => d.entries || []);
}
const fmt = (v) => (Array.isArray(v) ? (v.every((x) => x === v[0]) ? v[0] : v.join("/")) : v);
function describe(e) {
  const w = fmt(e.weight_lb);
  return `${e.exercise} ${e.sets}×${fmt(e.reps)}${w && w !== 0 ? ` @ ${w}` : ""}${e.unmapped || !EXERCISES[e.exercise] ? " (not mapped yet)" : ""}`;
}

// ---------------------------------------------------------------- the scene
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceef1);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-1.2, 2.4, 2.2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(1.5, 1.0, -2.0); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0aa, 0.25));
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 30);
// ambient occlusion darkens the grooves between muscles, which is what makes them read as separate
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera, 2, 2);
ao.updateGtaoMaterial({ radius: 0.035, distanceExponent: 1.4, thickness: 1.2, scale: 1.25, samples: 16 });
ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
composer.addPass(ao);
composer.addPass(new OutputPass());
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.minDistance = 0.8; controls.maxDistance = 7;

{
  const g = document.createElement("canvas"); g.width = g.height = 128;
  const x = g.getContext("2d"), r = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(40,46,56,.32)"); r.addColorStop(1, "rgba(40,46,56,0)");
  x.fillStyle = r; x.fillRect(0, 0, 128, 128);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(g), transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = 0.004; floor.renderOrder = -1;
  scene.add(floor);
}
const CLAY = new THREE.MeshStandardMaterial({ color: 0xb4b7bc, roughness: 0.55, metalness: 0 });
const TENDON = new THREE.MeshStandardMaterial({ color: 0xf3f2ee, roughness: 0.4, metalness: 0 });
const BONE = new THREE.MeshStandardMaterial({ color: 0xe2ddd2, roughness: 0.7, metalness: 0 });
const SKIN = new THREE.MeshStandardMaterial({ color: 0xc3c6cb, roughness: 0.5, metalness: 0 });
// under the head's skin: the skull and the face's muscles are not drawn (names from the manifest, by height)
let UNDER_HEAD = new Set();
const HIDE = /Bursa|Fascia|Articular capsule|Ligament|Cartilage/;
const SHEATH = /^(External abdominal oblique|Internal abdominal oblique|Transversus abdominis) muscle/;
// deep layers no one can see from outside, which only flicker through the layer above
const DEEP = /^(Internal abdominal oblique|Transversus abdominis|Innermost intercostal|Internal intercostal) muscle/;

const parts = new Map();   // base name -> [{ mesh, side }] (muscle-material primitives only)
const pick = [];           // meshes the pointer can hit
const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath("./m/draco/");
loader.setDRACOLoader(draco);

function base(name) { return name.replace(/\.(l|r)$/, ""); }
// the glTF loader strips dots and spaces from node names; the manifest gives back the atlas's own names
const sanitize = (n) => n.replace(/\s/g, "_").replace(/[\[\]\.:\/]/g, "");
let ORIGINAL = new Map(), MUSCLE_NAMES = new Set();
function addModel(gltf, kind) {
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    // a node with two materials comes in as a group of meshes; the object's name is on the group
    const key = ORIGINAL.has(o.name) ? o.name : o.parent?.name;
    const name = ORIGINAL.get(key) || key || o.name;
    const matName = o.material?.name || "";
    if (kind === "muscles" && (HIDE.test(matName) || DEEP.test(name))) { o.visible = false; return; }
    if (kind === "head") {
      o.material = SKIN;
      return;
    }
    if (UNDER_HEAD.has(name)) { o.visible = false; return; }
    if (kind === "skeleton") { if (MUSCLE_NAMES.has(name)) { o.visible = false; return; } o.material = BONE; return; }
    // the abdominal wall's aponeuroses (the rectus sheath) lie over rectus abdominis and over each other; atlas plates
    // show rectus itself, so the sheath's tendon layers are left out, and the muscles of the wall stay
    if (matName === "Tendon" && SHEATH.test(name)) { o.visible = false; return; }
    if (matName === "Tendon") { o.material = TENDON; return; }
    o.material = CLAY.clone();
    const b = base(name);
    if (!parts.has(b)) parts.set(b, []);
    parts.get(b).push(o);
    o.userData.part = b;
    pick.push(o);
  });
  scene.add(gltf.scene);
}

// heat: 0 sets -> clay; warm orange through red; 10 a week (ACSM 2026's growth dose) sits mid-scale, 20+ is deepest
const STOPS = [[0, 0xb4b7bc], [0.25, 0xf0b08c], [0.55, 0xea6a43], [1, 0xb8141c]].map(([t, c]) => [t, new THREE.Color(c)]);
function heat(sets) {
  const t = Math.min(1, sets / 20);
  if (sets <= 0) return STOPS[0][1].clone();
  for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
    const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i];
    return c0.clone().lerp(c1, (t - t0) / (t1 - t0));
  }
  return STOPS[STOPS.length - 1][1].clone();

let day = 6, playing = false, playT = 0, fresh = new Set();
const daysEl = document.getElementById("days");
DAYS.forEach((name, i) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = name;
  b.addEventListener("click", () => { stopPlay(); setDay(i); });
  daysEl.appendChild(b);
});
function showWeek() {
  const dates = weekDates(), today = iso(todayNY());
  [...daysEl.children].forEach((b, i) => b.classList.toggle("trained", entriesOn(dates[i]).length > 0));
  const thisWeek = iso(mondayOf(todayNY())) === dates[0];
  const label = new Date(dates[0] + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  document.getElementById("weekLabel").textContent = thisWeek ? "This week" : `Week of ${label}`;
  document.getElementById("bNext").disabled = thisWeek;
  setDay(thisWeek ? Math.max(0, dates.indexOf(today)) : 6);
}
async function goWeek(n) { stopPlay(); weekStart = addDays(weekStart, 7 * n); await loadLog(); showWeek(); }
document.getElementById("bPrev").addEventListener("click", () => goWeek(-1));
document.getElementById("bNext").addEventListener("click", () => goWeek(1));
function setDay(d) {
  day = d;
  [...daysEl.children].forEach((b, i) => { b.classList.toggle("cur", i === d); b.classList.toggle("done", i < d); });
  const sets = setsThrough(d);
  fresh = trainedOn(d);
  for (const [b, meshes] of parts) {
    const c = heat(sets.get(b) || 0);
    for (const m of meshes) { m.material.color.copy(c); m.userData.sets = sets.get(b) || 0; }
  }
  const log = entriesOn(weekDates()[d]);
  const sessionEl = document.getElementById("session");
  sessionEl.replaceChildren();
  const b = document.createElement("b"); b.textContent = DAYS[d]; sessionEl.append(b, " · ");
  const anyThisWeek = weekDates().some((dt) => entriesOn(dt).length);
  sessionEl.append(log.length ? log.map(describe).join(" · ") : anyThisWeek ? "rest" : "nothing logged this week yet");
  if (hovered) showCard(hovered);
}

// ---- the card: the coach's group and its parts, as in an atlas
const card = document.getElementById("card");
let hovered = null;
function showCard(b) {
  const g = groupOf.get(b);
  const list = g ? GROUPS.find(([n]) => n === g)[1] : [b];
  const sets = setsThrough(day);
  document.getElementById("cardTitle").textContent = g || "Muscle";
  const ul = document.getElementById("cardParts"); ul.replaceChildren();
  for (const p of list) {
    const li = document.createElement("li");
    li.textContent = p.replace(/[()]/g, "").replace(/ muscle$/, "").replace(/ of (pectoralis major|deltoid|trapezius)( muscle)?/, "").replace(/ of (biceps brachii|triceps brachii|biceps femoris|gastrocnemius)/, "");
    if (p === b) li.classList.add("lit");
    ul.appendChild(li);
  }
  const total = list.reduce((a, p) => a + (sets.get(p) || 0), 0);
  document.getElementById("cardSets").textContent = `${(sets.get(b) || 0).toFixed(1)} sets this week · ${b.replace(/[()]/g, "")}`;
  void total;
  card.classList.add("on");
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;   // a tap, not a turn
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pick, false)[0];
  hovered = hit ? hit.object.userData.part : null;
  if (hovered) showCard(hovered); else card.classList.remove("on");
});

// ---- play the week: a day every 1.2 s; the day's trained muscles pulse
const bPlay = document.getElementById("bPlay");
const PLAY = "M8 5.5v13l11-6.5z", PAUSE = "M7 5h3.5v14H7zM13.5 5H17v14h-3.5z";
function stopPlay() { playing = false; document.getElementById("playIcon").setAttribute("d", PLAY); bPlay.setAttribute("aria-label", "Play the week"); }
bPlay.addEventListener("click", () => {
  if (playing) return stopPlay();
  playing = true; playT = 0; document.getElementById("playIcon").setAttribute("d", PAUSE); bPlay.setAttribute("aria-label", "Pause"); setDay(0);
});
// ---- full screen: the page itself goes quiet (everything but the figure fades), which works on every
// device; where the browser also allows true full screen (laptops, Android), it takes the whole screen too.
// iPhones don't give web pages true full screen; Add to Home Screen opens Werk without the browser's bars.
const bFull = document.getElementById("bFull");
const FULL = "M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z", EXIT = "M8 4h2v6H4V8h4zM14 4h2v4h4v2h-6zM4 14h6v6H8v-4H4zM14 14h6v2h-4v4h-2z";
let immersive = false;
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function setImmersive(on) {
  immersive = on;
  document.body.classList.toggle("immersive", on);
  bFull.setAttribute("aria-pressed", String(on));
  bFull.setAttribute("aria-label", on ? "Leave full screen" : "Full screen");
  document.getElementById("fullIcon").setAttribute("d", on ? EXIT : FULL);
  refit();
}
bFull.addEventListener("click", () => {
  if (!immersive) {
    setImmersive(true);
    const el = document.documentElement, go = el.requestFullscreen || el.webkitRequestFullscreen;
    try { const r = go && go.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  } else {
    leavingByButton = true; setImmersive(false); setTimeout(() => { leavingByButton = false; }, 500);
    if (fsElement()) { const d = document; try { const r = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
  }
});
const onFs = () => { if (!fsElement() && immersive && !leavingByButton) setImmersive(false); };
let leavingByButton = false;
document.addEventListener("fullscreenchange", onFs);
document.addEventListener("webkitfullscreenchange", onFs);
addEventListener("keydown", (e) => { if (e.key === "Escape" && immersive) setImmersive(false); });
let facing = 1, turnTo = null;
document.getElementById("bTurn").addEventListener("click", () => { facing *= -1; turnTo = facing; });

let H = 1.71, CY = 0.86;
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  // fit the whole figure, with room for the controls below
  // the figure fits the band between the title and the controls (about 90 px above, 190 px below)
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const top = immersive ? 70 : 96, bottom = immersive ? 30 : 150, band = Math.max(0.4, (h - top - bottom) / h);
  const needH = H * 1.04 / band, needW = 0.72 * 1.12;
  const dist = Math.max(needH / (2 * Math.tan(vfov / 2)), needW / (2 * Math.tan(vfov / 2) * camera.aspect));
  // shift the view so the band's middle, not the screen's, holds the figure
  camera.setViewOffset(w, h, 0, (bottom - top) / 2, w, h);
  camera.updateProjectionMatrix();
  return dist;
}
let dist = frame();
function placeCamera() {
  dist = frame();
  camera.position.set(0, CY + 0.02, dist * facing);
  controls.target.set(0, CY - 0.05, 0);
  controls.update();
}
// keep the view direction and zoom the user chose, rescaled to the new frame
function refit() { const d = camera.position.distanceTo(controls.target); const nd = frame(); camera.position.sub(controls.target).multiplyScalar(nd / d).add(controls.target); }
addEventListener("resize", refit);

// after a quiet spell the figure turns slowly, like a piece on a turntable; any touch stops it
let lastTouch = performance.now();
for (const ev of ["pointerdown", "wheel", "keydown"]) addEventListener(ev, () => { lastTouch = performance.now(); controls.autoRotate = false; }, { passive: true });
controls.autoRotateSpeed = 0.55;
const clock = new THREE.Clock();
function tick() {
  if (window.__freeze) { requestAnimationFrame(tick); return; }   // (the test harness renders single frames)
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (playing) { playT += dt; const d = Math.min(6, Math.floor(playT / 1.2)); if (d !== day) setDay(d); if (playT > 7.2) stopPlay(); }
  if (turnTo !== null) {
    // swing round to face front or back
    const off = camera.position.clone().sub(controls.target);
    const a = Math.atan2(off.x, off.z), goal = turnTo > 0 ? 0 : Math.PI;
    let da = ((goal - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const step = Math.sign(da) * Math.min(Math.abs(da), dt * 4);
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), step);
    camera.position.copy(controls.target).add(off);
    if (Math.abs(da) < 0.01) turnTo = null;
  }
  // the day's work glows a little, breathing
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
  const sel = hovered ? new Set(groupOf.has(hovered) ? GROUPS.find(([g]) => g === groupOf.get(hovered))[1] : [hovered]) : null;
  for (const [b, meshes] of parts) {
    const e = fresh.has(b) ? 0.10 + 0.12 * pulse : 0;
    const lift = sel && sel.has(b) ? (b === hovered ? 0.09 : 0.045) : 0;   // the tapped muscle and its group, lifted
    for (const m of meshes) m.material.emissive.setRGB(e + lift, e * 0.25 + lift, e * 0.1 + lift);
  }
  if (!controls.autoRotate && turnTo === null && !playing && performance.now() - lastTouch > 12000) controls.autoRotate = true;
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}

const got = {}, sizes = {};
const progress = (k) => (ev) => { got[k] = ev.loaded; if (ev.total) sizes[k] = ev.total;
  const tot = Object.values(sizes).reduce((a, b) => a + b, 0); if (tot) document.getElementById("loading").textContent = `Loading the anatomy · ${Math.min(99, Math.round(100 * Object.values(got).reduce((a, b) => a + b, 0) / tot))}%`; };
Promise.all([loader.loadAsync("./m/model/muscles.glb", progress("m")), loader.loadAsync("./m/model/skeleton.glb", progress("s")), loader.loadAsync("./m/model/head.glb", progress("h")), fetch("./m/model/manifest.json").then((r) => r.json()),
  fetch("./m/data/exercises.json", { cache: "no-cache" }).then((r) => r.json()), loadLog()]).then(([mu, sk, hd, man, exDoc]) => {
  EXERCISES = exDoc.exercises; GROUPS = exDoc.groups;
  groupOf = new Map(); for (const [g, list] of GROUPS) for (const p of list) groupOf.set(p, g);
  ORIGINAL = new Map([...man.muscles, ...man.skeleton].map((o) => [sanitize(o.name), o.name]));
  MUSCLE_NAMES = new Set(man.muscles.map((o) => o.name));
  ORIGINAL = new Map([...ORIGINAL, ...man.head.map((o) => [sanitize(o.name), o.name])]);
  // the head's skin begins at the jaw; what lies wholly above its lowest point is under it
  const chin = Math.min(...man.head.filter((o) => !/auric|Helix|Tragus|Lobule|Scapha|Concha|conchae|fossa|Eminentia|incisure|Apex|tubercle|groove|Mastoid|Occipital/i.test(o.name)).map((o) => o.min[2]));
  UNDER_HEAD = new Set([...man.muscles, ...man.skeleton].filter((o) => o.min[2] > chin + 0.005).map((o) => o.name));
  addModel(hd, "head");
  addModel(sk, "skeleton");
  addModel(mu, "muscles");
  const box = new THREE.Box3().setFromObject(mu.scene);
  H = box.max.y - box.min.y; CY = (box.max.y + box.min.y) / 2;
  const missing = [...new Set(Object.values(EXERCISES).flatMap((e) => [...e.primary, ...e.secondary, ...e.stabilizers]))].filter((p) => !parts.has(p));
  if (missing.length) console.warn("parts not in the atlas:", missing);
  window.__mm = { sk: sk.scene, mu: mu.scene, parts, missing, setDay, camera, controls, render: () => composer.render(), turn: (f) => { facing = f; placeCamera(); } };
  document.getElementById("loading").remove();
  placeCamera();
  showWeek();
  tick();
}).catch((e) => { document.getElementById("loading").textContent = "Couldn't load the anatomy: " + e.message; console.error(e); });
</script>
</body>
</html>
